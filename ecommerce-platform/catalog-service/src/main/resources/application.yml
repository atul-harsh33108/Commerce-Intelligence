# All that catalog-service carries in its jar.
#
# The datasource, the port, the signing key, the log levels and the Flyway locations are served by
# the config server. What cannot move is the bootstrap paradox: a service cannot fetch its
# configuration until it knows its own name and the address of the server holding it.

spring:
  application:
    name: catalog-service
  profiles:
    default: dev
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 8000

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
