spring:
  application:
    name: user-service
  profiles:
    default: dev
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 8000

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
