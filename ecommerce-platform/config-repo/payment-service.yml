# payment-service, all profiles.

server:
  port: 8085

spring:
  flyway:
    locations: classpath:db/migration

app:
  outbox:
    poll-interval-ms: 500
    batch-size: 100
  payment:
    # The simulated gateway's failure rate. 0 by default so the happy path is deterministic; the
    # saga's compensation test sets it to 1.0 to force a failure, which is how compensation is proven
    # rather than asserted.
    failure-rate: ${PAYMENT_FAILURE_RATE:0.0}
    # A fixed processing delay, so the saga's timing is visible in traces rather than instantaneous.
    latency: PT0.05S
