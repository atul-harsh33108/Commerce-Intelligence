# The profile every test runs under.
#
# No datasource block: Testcontainers supplies one at runtime through @ServiceConnection, and
# hard-coding a URL here is exactly the coupling to a hand-started database that Testcontainers
# removes.
#
# Two separate mechanisms keep the config server out of the tests, and BOTH are required. The
# `on-profile: "!test"` guard in the main application.yml stops the *fetch* - config-data imports
# resolve in an early phase, before this file is visible, so disabling the client here could not have
# prevented it. The flag below stops the *check*: spring-cloud-starter-config refuses to start a
# context that has the starter on the classpath and no `spring.config.import`. That check earns its
# keep in production, where what it catches is a service quietly running on bundled defaults.

spring:
  kafka:
    # A bootstrap address that is never contacted: the KafkaTemplate is a mock in these tests, and
    # the listener containers are disabled below. Left non-empty so autoconfiguration succeeds.
    bootstrap-servers: localhost:59092
    listener:
      # NO LISTENER CONTAINERS. A @KafkaListener that starts here would spend the suite retrying a
      # connection to a broker that does not exist, and its errors would drown the assertions.
      auto-startup: false
  cloud:
    config:
      enabled: false
    discovery:
      # Eureka off. A test that registers with a registry leaves an entry behind pointing at a JVM
      # that has exited, and the gateway then routes real traffic to it.
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    # db/migration only. Any seed data is deliberately absent: a test that depends on demo rows
    # breaks the moment somebody edits the seed file, and "which rows exist" should be the test's own
    # decision.
    locations: classpath:db/migration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  outbox:
    # The relay is a scheduled bean; tests drive OutboxPublisher directly so that "did it publish?"
    # has one answer rather than racing a background thread.
    enabled: false
    poll-interval-ms: 500
    batch-size: 100
  saga:
    recovery-enabled: false
    timeout: PT2M
  kafka:
    topics:
      order-placed: test.order.placed
      inventory-reserved: test.inventory.reserved
      inventory-failed: test.inventory.failed
      payment-completed: test.payment.completed
      payment-failed: test.payment.failed
      order-confirmed: test.order.confirmed
      order-cancelled: test.order.cancelled
    groups:
      order: order-service-test
  jwt:
    # Test-only, and irrelevant beyond satisfying the length constraint - nothing signed here
    # outlives the test JVM.
    secret: test-only-signing-key-not-used-anywhere-else-0123456789
    expiration-minutes: 60
    issuer: ecommerce

logging:
  level:
    # KafkaAdmin tries to create the declared topics at startup and logs "Could not configure topics"
    # at ERROR when there is no broker. Harmless here - the template is mocked and no container
    # starts - but an ERROR line in a green build teaches people to ignore ERROR lines.
    org.springframework.kafka.core.KafkaAdmin: OFF
    org.springframework.web: WARN
    org.hibernate: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
