# The Secrets the Deployments reference — as an EXAMPLE, with fake values.
#
# THIS FILE IS THE ONLY VERSION OF IT IN GIT, and that is the point rather than an oversight. A
# Kubernetes Secret is base64, not encryption: `kubectl get secret -o yaml | base64 -d` returns the
# password. Committing a real one publishes it, and committing an encrypted one requires a story
# about where the key lives that this project does not have.
#
# Create the real ones out of band:
#
#   kubectl -n ecommerce create secret generic order-service-db \
#     --from-literal=username=orderdb \
#     --from-literal=password="$(read -s p && echo "$p")"
#
# In a cluster the answer is External Secrets Operator pulling from AWS Secrets Manager, or SOPS with
# a KMS key — both of which make "what is the password" a question with an audit log attached.
#
# Note what is NOT here: the JWT signing key. It is currently in config-repo, which is fine on a
# laptop and is the first thing that has to move on a real deployment — recorded in
# docs/reflection.md rather than quietly left as it is.

apiVersion: v1
kind: Secret
metadata:
  name: user-service-db
  namespace: ecommerce
type: Opaque
stringData:
  username: userdb
  password: CHANGE_ME
---
