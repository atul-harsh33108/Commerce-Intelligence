server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback. React Router owns /cart, /orders/{key} and /analytics, and none of those are
    # files on disk - so a reload or a pasted link 404s without this line. It is the single most
    # common way a SPA that works locally breaks the moment it is served by a real web server,
    # because `npm run dev` handles the fallback for you and nginx does not.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction: Vite puts a content hash in every filename, so a
    # changed file is a different URL and can never be served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or a browser keeps loading an old page that references asset
    # hashes which no longer exist - a blank screen after a deploy, with 404s in the console.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
