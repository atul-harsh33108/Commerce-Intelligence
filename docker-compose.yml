  # -----------------------------------------------------------------------------------------------
  # OBSERVABILITY (Step 13). `--profile observability`, so the default `docker compose up` stays the
  # set of things the platform cannot run without. Prometheus and Zipkin are how you find out WHY it
  # is slow; they are not how it works.
  # -----------------------------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:3.5
    container_name: ecommerce-zipkin
    profiles: ["observability"]
    ports: ["9411:9411"]
    environment:
      # In-memory storage. Traces are lost on restart, which is correct for a laptop and would be
      # indefensible in production - there, this is Elasticsearch or Cassandra behind the same API.
      # Naming it here so the limitation is a choice rather than a default nobody looked at.
      STORAGE_TYPE: mem
      # 50k spans, in a 1 GB container. Both numbers are a correction.
      #
      # The first attempt was 100k spans in 512 MB, and Zipkin ran for about three hours and then
      # died with `Terminating due to java.lang.OutOfMemoryError: Java heap space`. The arithmetic
      # was never checked: an in-memory span with tags and endpoints is on the order of 1-3 KB, so
      # 100k of them is 100-300 MB of live data plus Armeria's buffers plus the JVM's own overhead,
      # against a 512 MB cgroup limit.
      #
      # What made it fill so fast is the more interesting half. Sampling is 1.0, and the busiest
      # traced traffic on an idle platform is not orders - it is Prometheus scraping nine
      # /actuator/prometheus endpoints every ten seconds and nine Eureka clients heartbeating every
      # thirty. The observability stack is its own heaviest user. Same effect that made the order
      # trace impossible to find by "most recent" - see docs/reflection.md.
      MEM_MAX_SPANS: 50000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 1G } } }

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: ecommerce-prometheus
    profiles: ["observability"]
    # 9091 on the HOST, 9090 inside. 9090 was already taken - it is the api-gateway's separate
    # management port, which exists so that no route through the edge can reach actuator. Grafana
    # still reaches it as `http://prometheus:9090` because that is container-to-container on the
    # compose network and never touches the host's port space.
    ports: ["9091:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      # Needed by Grafana's "Explore" and by exemplars; harmless otherwise.
      - --web.enable-lifecycle
    # NOT on the compose network alone. The Java services run as host JVMs (see scripts/dev-stack.ps1),
    # not containers, so Prometheus has to reach the host - `host.docker.internal` in the scrape
    # config, and this line is what makes that name resolve on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy: { resources: { limits: { memory: 512M } } }

  grafana:
    image: grafana/grafana:12.3.1
    container_name: ecommerce-grafana
    profiles: ["observability"]
    ports: ["3001:3000"]
    environment:
      # Anonymous admin access. On a laptop a login screen in front of a dashboard nobody else can
      # reach is friction with no security value - the port is bound to localhost and the data is
      # metrics about a demo. In any shared environment this block is the first thing to delete.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # 3001 on the host because 3000 is the storefront. Grafana needs to know its own external URL
      # or every generated link points at a port nothing is listening on.
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy: { resources: { limits: { memory: 512M } } }


